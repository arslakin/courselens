AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CourseLens - turn course materials into an actionable learning plan.
  Minimal serverless backend: one Lambda behind an API Gateway HTTP API,
  calling Amazon Bedrock (Nova Lite) via the Converse API. Stateless (no DB).

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model id used for all Converse calls.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Region where Bedrock is invoked.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: >
      Allowed CORS origin for the API. "*" for early development; set to the
      CloudFront domain once the frontend is deployed.
  ThrottleRateLimit:
    Type: Number
    Default: 5
    Description: >
      Steady-state requests/second allowed across the API (token-bucket refill
      rate). Conservative for a hackathon demo; caps sustained Bedrock usage.
  ThrottleBurstLimit:
    Type: Number
    Default: 10
    Description: >
      Maximum concurrent request burst before API Gateway returns HTTP 429.
  ExecutionRolePermissionsBoundaryArn:
    Type: String
    Description: >
      ARN of the permissions boundary applied to the CourseLens Lambda
      execution role. This managed policy is created ONCE, out-of-band, by an
      administrator (NOT by courselens-deployer) and caps what the execution
      role can ever do (Logs + Bedrock InvokeModel on Nova). It is the control
      that prevents the deployer from granting the Lambda arbitrary account
      permissions. See iam/README.md and iam/courselens-execution-boundary.json.

Globals:
  Function:
    Runtime: python3.12
    # Cost-conscious sizing. The work is I/O-bound (waiting on Bedrock), so a
    # small memory footprint is fine; 512 MB gives enough headroom for pypdf /
    # python-docx parsing without over-paying.
    MemorySize: 512
    # Bedrock generation for a full analysis can take a few seconds; 30s leaves
    # comfortable margin while capping worst-case cost per invocation.
    Timeout: 30
    Architectures:
      - arm64  # Graviton: cheaper per-ms than x86 for the same work.

Resources:
  CourseLensApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: courselens-http-api
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS
      # Stage-level default throttling. This is a native API Gateway setting —
      # it adds no extra infrastructure and no cost, and returns HTTP 429 when
      # limits are exceeded. It is the primary protection against accidental or
      # abusive Bedrock usage for the public demo.
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  # Explicit, CourseLens-named runtime permissions for the Lambda, defined as a
  # standalone *customer-managed* policy (not an inline role policy). Using a
  # managed policy means the deployer never needs iam:PutRolePolicy: the role is
  # created and this policy is attached via iam:AttachRolePolicy, which the
  # deploy policy locks down by exact policy ARN. The document is fixed here in
  # source, so the deployer cannot author arbitrary runtime permissions.
  CourseLensExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: courselens-api-execution-policy
      Description: >-
        Runtime permissions for the CourseLens Lambda: CloudWatch Logs and
        Bedrock InvokeModel for the configured Amazon Nova model only.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/courselens-*
          - Sid: InvokeBedrockNovaModelsOnly
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub arn:aws:bedrock:${BedrockRegion}::foundation-model/amazon.nova-*

  # Explicit, CourseLens-named execution role. Its permissions come solely from
  # the managed policy above (attached by ARN). No inline policies are used, so
  # the deployer needs no iam:PutRolePolicy / iam:DeleteRolePolicy.
  #
  # PermissionsBoundary is the hard cap: even if the attached policy were later
  # widened, the role's *effective* permissions can never exceed the boundary
  # (Logs + Bedrock InvokeModel on Nova). The deploy policy additionally forces
  # any role the deployer creates to carry exactly this boundary, so the
  # deployer cannot create an unbounded execution role.
  CourseLensExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: courselens-api-execution-role
      PermissionsBoundary: !Ref ExecutionRolePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CourseLensExecutionPolicy

  CourseLensFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: courselens-api
      Description: CourseLens API handler (analyze + explain).
      CodeUri: src/
      Handler: courselens.api.handler
      # Use the explicit role above; do NOT let SAM generate an implicit role
      # with an inline policy (which is what previously forced the deployer to
      # hold iam:PutRolePolicy).
      Role: !GetAtt CourseLensExecutionRole.Arn
      Environment:
        Variables:
          COURSELENS_MODEL_ID: !Ref BedrockModelId
          COURSELENS_AWS_REGION: !Ref BedrockRegion
      Events:
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref CourseLensApi
            Path: /analyze
            Method: POST
        Explain:
          Type: HttpApi
          Properties:
            ApiId: !Ref CourseLensApi
            Path: /explain
            Method: POST

Outputs:
  ApiBaseUrl:
    Description: Base URL of the CourseLens HTTP API.
    Value: !Sub https://${CourseLensApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionName:
    Description: CourseLens Lambda function name.
    Value: !Ref CourseLensFunction

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  RojAnda transcription backend (isolated from the frozen RojLearn/courselens
  stack). Real Turkish (tr-TR) speech-to-text via Amazon Transcribe (batch).
  Flow: client gets a size-limited presigned POST -> uploads .m4a to a private,
  per-user S3 prefix -> backend starts a Transcribe job -> client polls status
  -> editable Turkish transcript. No AWS credentials in the client; the API is
  authorized by a Cognito USER POOL JWT authorizer and ownership is the verified
  `sub`, enforced server-side. NOTHING here touches courselens/RojLearn.

  Phase 1C: the Cognito User Pool + public app client are now defined AS CODE in
  this stack (reproducible IaC), and the JWT authorizer + the client config
  outputs reference them. Persistent student data lives in a single-table
  DynamoDB `rojanda-app` keyed by OWNER#<sub>. Still NOT deployed; no AWS
  resources are created by writing this file.

Parameters:
  AwsRegion:
    Type: String
    Default: eu-central-1
    Description: >
      Production target region for RojAnda (nearest full region to Turkey with
      all required services). The stack itself deploys into whatever region the
      deploy command targets; kept as a parameter so region-dependent config is
      not hardcoded and client config outputs can reference it.
  MediaBucketName:
    Type: String
    Default: rojanda-media-387276719593
  ExecutionRolePermissionsBoundaryArn:
    Type: String
    Description: >
      ARN of the admin-owned permissions boundary applied to both RojAnda
      Lambda roles. It retains the existing API ceiling and, before a
      Bedrock-enabled Phase 2 deploy, must add principal-scoped allowances for:
      API SendMessage to the study queue; worker consumption of that queue; and
      worker-only InvokeModel on the approved EU Nova Lite profile/models.
      The identity policies remain narrower and provide the actual grants.
  MaxAudioSeconds:
    Type: Number
    Default: 5400   # 90 minutes hard cap (also enforced client-side)
  MaxUploadBytes:
    Type: Number
    Default: 157286400   # ~150 MB presigned POST content-length-range ceiling
  DailyMinutesAllowancePerIdentity:
    Type: Number
    Default: 120   # per-Cognito-identity per-day transcription minutes allowance
  ThrottleRateLimit:
    Type: Number
    Default: 5
  ThrottleBurstLimit:
    Type: Number
    Default: 10
  CostAlarmThresholdUsd:
    Type: Number
    Default: 25
  # --- Phase 2: study-material AI provider ---------------------------------
  StudyProvider:
    Type: String
    Default: local
    AllowedValues: [local, bedrock]
    Description: >
      Study-material generation provider. "local" is a deterministic grounded
      extractive generator (no model cost). "bedrock" uses Amazon Bedrock and
      also requires AllowBedrock=1. Default local so no paid model runs unless
      explicitly enabled for a deploy.
  BedrockModelId:
    Type: String
    Default: eu.amazon.nova-lite-v1:0
    AllowedValues:
      - eu.amazon.nova-lite-v1:0
    Description: >
      EU cross-region inference profile selected for the first controlled
      RojAnda test. Constrained to Nova Lite so the worker IAM policy can remain
      exact; expanding models later requires an explicit template/IAM review.
  AllowBedrock:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: >
      Hard safety gate. Bedrock is only ever invoked when this is "1" AND
      StudyProvider=bedrock. Keeps paid models off by default.

Conditions:
  # Bedrock is "really on" only when the provider is bedrock AND the hard safety
  # gate is open. This single condition drives BOTH the conditional IAM grant
  # and the async pipeline: with the default (local / "0") NO Bedrock permission
  # and NO queue/worker exist — the local provider runs inline in the API
  # Lambda (deterministic, sub-second, no HTTP-timeout risk). When Bedrock is
  # enabled, the API Lambda enqueues and a worker Lambda does the long work off
  # the 30s API Gateway request path.
  BedrockEnabled: !And
    - !Equals [!Ref StudyProvider, bedrock]
    - !Equals [!Ref AllowBedrock, "1"]

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 512
    Timeout: 30
    Architectures:
      - arm64

Resources:

  # ---------------------------------------------------------------------------
  # Private media bucket: audio + Transcribe output. No public access.
  # ---------------------------------------------------------------------------
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref MediaBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      LifecycleConfiguration:
        # Retention policy (approved): objects under owners/ expire after 30
        # days. This deletes the ORIGINAL uploaded audio (.m4a) AND the raw
        # Amazon Transcribe output JSON. The transcript TEXT persists in
        # DynamoDB (TRANSCRIPT# item), so transcripts remain available after the
        # audio is expired. Prefix matches the final authenticated key shape
        # `owners/<sub>/...` (was `users/` before the Phase 1C key migration).
        Rules:
          - Id: expire-raw-media-30d
            Status: Enabled
            Prefix: owners/
            ExpirationInDays: 30
      CorsConfiguration:
        # Native app has no fixed web origin; CORS is a browser control, not an
        # auth control (auth = presigned POST signature + IAM). MUST be pinned
        # to the RojAnda web production origin when a web app is published.
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["content-type"]
            MaxAge: 3000

  MediaBucketTlsOnlyPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub arn:aws:s3:::${MediaBucketName}
              - !Sub arn:aws:s3:::${MediaBucketName}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------------------
  # Single-table persistent store for all RojAnda student data.
  #   PK = OWNER#<sub>  (the verified Cognito User Pool sub)
  #   SK = PROFILE | COURSE#<id> | COURSE#<id>#LESSON#<id>
  #        | SOURCE#<lessonId>#<sourceId> | TRANSCRIPT#<lessonId>
  #        | TRANSCRIBE_JOB#<jobName> | USAGE#<yyyy-mm-dd>
  # Every normal read is GetItem / Query on ONE partition (no scans). On-demand
  # billing for the beta. TTL auto-expires USAGE#/TRANSCRIBE_JOB# rows.
  # ---------------------------------------------------------------------------
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rojanda-app
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk        # "OWNER#<sub>"
          KeyType: HASH
        - AttributeName: sk        # entity discriminator (see above)
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # Lambda execution role: permissions come solely from the managed policy
  # below (attached by ARN); capped by the admin-owned permissions boundary.
  # ---------------------------------------------------------------------------
  TranscribeExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: rojanda-transcribe-execution-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rojanda-*
          - Sid: TranscribeStartGetOnly
            Effect: Allow
            # Transcribe Start/Get do NOT support resource-level ARN scoping;
            # "*" is required by AWS. Isolation = server-generated per-user job
            # names + ownership check + per-user S3 prefixes.
            Action:
              - transcribe:StartTranscriptionJob
              - transcribe:GetTranscriptionJob
            Resource: "*"
          - Sid: MediaBucketObjectsOnly
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub arn:aws:s3:::${MediaBucketName}/*
          - Sid: AppTableOnly
            Effect: Allow
            # Single-table access for profile/course/lesson/source/transcript/
            # job/usage. Query enables per-owner listing; DeleteItem enables
            # course/lesson deletion + future account deletion. Scoped to the
            # one table; every item is partitioned by OWNER#<sub>.
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt AppTable.Arn

  # ---------------------------------------------------------------------------
  # Async study-generation pipeline (ONLY created when Bedrock is enabled).
  # Dead-letter queue first so the main queue can reference it.
  # ---------------------------------------------------------------------------
  StudyJobDLQ:
    Type: AWS::SQS::Queue
    Condition: BedrockEnabled
    Properties:
      QueueName: rojanda-study-jobs-dlq
      MessageRetentionPeriod: 1209600   # 14 days to inspect poisoned jobs

  StudyJobQueue:
    Type: AWS::SQS::Queue
    Condition: BedrockEnabled
    Properties:
      QueueName: rojanda-study-jobs
      # Visibility must exceed the worker's max run time so a job is not
      # redelivered while still being processed (would risk a duplicate run;
      # the claim-token idempotency still guards spend, but this avoids the race
      # entirely). Worker timeout is 300s below; 360s gives margin.
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StudyJobDLQ.Arn
        maxReceiveCount: 3

  # API policy: enqueue only. The API Lambda never gets queue-consumer or
  # Bedrock permissions. Conditional means default/local deployments add no SQS
  # rights to the existing API role.
  StudyApiQueuePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: BedrockEnabled
    Properties:
      ManagedPolicyName: rojanda-study-api-queue-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SendStudyJobsOnly
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !GetAtt StudyJobQueue.Arn

  # Worker-only policy: minimum DynamoDB reads/writes used by run_study_job,
  # consumption of the MAIN queue only (SQS itself handles DLQ redrive), logs,
  # and InvokeModel only through the approved EU Nova Lite inference profile +
  # its exact destination foundation-model ARNs. No Transcribe or S3 access.
  StudyWorkerExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: BedrockEnabled
    Properties:
      ManagedPolicyName: rojanda-study-worker-execution-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: WorkerLogsOnly
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rojanda-study-worker*
          - Sid: WorkerStudyTableOnly
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
            Resource: !GetAtt AppTable.Arn
          - Sid: ConsumeStudyJobsOnly
            Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: !GetAtt StudyJobQueue.Arn
          - Sid: InvokeApprovedStudyModelOnly
            Effect: Allow
            Action: bedrock:InvokeModel
            Resource:
              # The inference profile passed as modelId.
              - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelId}
              # Exact foundation models the ACTIVE EU Nova Lite profile may
              # route to (verified read-only before deployment review).
              - arn:aws:bedrock:eu-central-1::foundation-model/amazon.nova-lite-v1:0
              - arn:aws:bedrock:eu-west-1::foundation-model/amazon.nova-lite-v1:0
              - arn:aws:bedrock:eu-west-3::foundation-model/amazon.nova-lite-v1:0
              - arn:aws:bedrock:eu-north-1::foundation-model/amazon.nova-lite-v1:0

  TranscribeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rojanda-transcribe-exec-role
      PermissionsBoundary: !Ref ExecutionRolePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref TranscribeExecutionPolicy
        # API gets ONLY SendMessage, and only when async Bedrock is enabled.
        - !If [BedrockEnabled, !Ref StudyApiQueuePolicy, !Ref "AWS::NoValue"]

  StudyWorkerExecutionRole:
    Type: AWS::IAM::Role
    Condition: BedrockEnabled
    Properties:
      RoleName: rojanda-study-worker-exec-role
      PermissionsBoundary: !Ref ExecutionRolePermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StudyWorkerExecutionPolicy

  TranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: rojanda-api
      Description: >
        RojAnda authenticated API: profile, courses, lessons, and transcription
        (upload-url + start + status). ownerId = verified Cognito sub.
      CodeUri: src/
      Handler: rojanda_transcribe.api.handler
      Role: !GetAtt TranscribeExecutionRole.Arn
      # The API handler never runs the long study MAP/REDUCE: with the local
      # provider it generates inline (deterministic, sub-second); with Bedrock
      # it ENQUEUES and returns 202 immediately. So the API stays within the
      # API Gateway HTTP API hard 30s integration timeout. (The heavy work runs
      # in StudyWorkerFunction below.)
      Timeout: 30
      Environment:
        Variables:
          ROJANDA_MEDIA_BUCKET: !Ref MediaBucketName
          ROJANDA_APP_TABLE: !Ref AppTable
          ROJANDA_MAX_AUDIO_SECONDS: !Ref MaxAudioSeconds
          ROJANDA_MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          ROJANDA_DAILY_MINUTES_ALLOWANCE: !Ref DailyMinutesAllowancePerIdentity
          ROJANDA_TRANSCRIBE_LANGUAGE: tr-TR
          # The API receives only the queue URL. It receives neither Bedrock
          # configuration nor Bedrock IAM permission. Empty when the local
          # provider is used, so the deterministic local generator runs inline.
          ROJANDA_STUDY_QUEUE_URL: !If [BedrockEnabled, !Ref StudyJobQueue, ""]
      Events:
        # Student profile
        GetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /profile
            Method: GET
        PutProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /profile
            Method: PUT
        # Courses
        ListCourses:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /courses
            Method: GET
        CreateCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /courses
            Method: POST
        GetCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}"
            Method: GET
        UpdateCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}"
            Method: PUT
        DeleteCourse:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}"
            Method: DELETE
        # Lessons (nested under a course)
        ListLessons:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons"
            Method: GET
        CreateLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons"
            Method: POST
        GetLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}"
            Method: GET
        UpdateLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}"
            Method: PUT
        DeleteLesson:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}"
            Method: DELETE
        # Sources + transcripts for a lesson (cross-device retrieval)
        ListSources:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}/sources"
            Method: GET
        ListTranscripts:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}/transcripts"
            Method: GET
        # Study materials (Phase 2): grounded, server-persisted, idempotent.
        ListStudy:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}/study"
            Method: GET
        GenerateStudy:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: "/courses/{courseId}/lessons/{lessonId}/study"
            Method: POST
        # Transcription
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /transcribe/upload-url
            Method: POST
        Start:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /transcribe/start
            Method: POST
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref TranscribeApi
            Path: /transcribe/status
            Method: GET

  # ---------------------------------------------------------------------------
  # Background study-generation worker (ONLY when Bedrock is enabled). Consumes
  # the study-job queue and performs the grounded MAP/REDUCE off the API request
  # path, so a full ~50-min lesson is not bound by the API Gateway 30s window.
  # Reuses the same code package but has a dedicated least-privilege execution
  # role. The API role cannot invoke Bedrock; only this worker role can.
  # ---------------------------------------------------------------------------
  StudyWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: BedrockEnabled
    Properties:
      FunctionName: rojanda-study-worker
      Description: >
        Grounded study-material generator. SQS-triggered; reads the authoritative
        transcript, runs the bounded MAP/REDUCE, persists ready/failed. Not on
        the API request path.
      CodeUri: src/
      Handler: rojanda_transcribe.worker.handler
      Role: !GetAtt StudyWorkerExecutionRole.Arn
      # Sized for the WORK (a full ~50-min lesson's chunk calls + synthesis),
      # not the HTTP window. Must stay below the queue VisibilityTimeout (360s).
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          ROJANDA_MEDIA_BUCKET: !Ref MediaBucketName
          ROJANDA_APP_TABLE: !Ref AppTable
          ROJANDA_TRANSCRIBE_LANGUAGE: tr-TR
          # The worker is the ONLY place that constructs the Bedrock provider.
          ROJANDA_STUDY_PROVIDER: !Ref StudyProvider
          ROJANDA_BEDROCK_MODEL_ID: !Ref BedrockModelId
          ROJANDA_ALLOW_BEDROCK: !Ref AllowBedrock
      Events:
        StudyJobs:
          Type: SQS
          Properties:
            Queue: !GetAtt StudyJobQueue.Arn
            BatchSize: 1
            # Report per-item failures so one bad job is retried/DLQ'd without
            # reprocessing a whole batch (worker returns batchItemFailures).
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # HTTP API. All routes require a valid Cognito USER POOL JWT (the authorizer
  # verifies signature/issuer/audience/expiry) -> no anonymous access, no client
  # AWS credentials, no SigV4. The Lambda derives ownerId from the verified
  # `sub` claim. Default-stage throttling caps abuse.
  # ---------------------------------------------------------------------------
  TranscribeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: rojanda-transcribe-http-api
      Auth:
        DefaultAuthorizer: RojandaUserPoolJwt
        Authorizers:
          RojandaUserPoolJwt:
            JwtConfiguration:
              # Issuer + audience come from the User Pool + app client created
              # in THIS stack (IaC), not from out-of-band parameters.
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
      CorsConfiguration:
        # NOTE: "*" origin is for the native app (no fixed web origin). When a
        # RojAnda WEB app ships, pin this to its exact origin.
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  # ---------------------------------------------------------------------------
  # Cognito USER POOL — the permanent student identity (Phase 1C IaC).
  # Email/password sign-up with email-code verification. No Identity Pool (the
  # client uses a Bearer JWT, holds no AWS credentials). Federation (Google/
  # Apple) is NOT configured here; the pool is designed to add them later
  # without recreating it.
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: rojanda-users
      # Sign in with email as the username.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Email verification via a code (Cognito default email sender for beta;
      # swap to SES before high volume).
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      # Password recovery via verified email only (no SMS/phone; we collect no
      # phone number). Explicit so the default doesn't allow an unexpected path.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Store minimal PII; deletion protection off for the beta (so the stack
      # can be torn down cleanly). Turn on before production launch.
      DeletionProtection: INACTIVE

  # Public app client — NO client secret (mobile/web public client). Enables
  # ONLY the auth flows the Phase 1 client uses: USER_PASSWORD_AUTH (email/
  # password) + REFRESH_TOKEN_AUTH (silent refresh). SRP/custom flows are off.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: rojanda-mobile
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      # Token lifetimes: short-lived ID/access, longer refresh.
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days
      # Federation (Google/Apple) + Hosted-UI OAuth are added in a later slice;
      # SupportedIdentityProviders stays COGNITO-only for now.
      SupportedIdentityProviders:
        - COGNITO

  # ---------------------------------------------------------------------------
  # Cost safeguards.
  # ---------------------------------------------------------------------------
  CostAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: rojanda-cost-alerts
      # NOTE: no email subscription is created yet (per instruction).

  # Account-wide estimated-charges alarm ($25). AWS/Billing is account-scoped by
  # design (no per-stack billing metric exists).
  CostGuardAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: rojanda-transcribe-cost-guard
      Namespace: AWS/Billing
      MetricName: EstimatedCharges
      Dimensions:
        - Name: Currency
          Value: USD
      Statistic: Maximum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: !Ref CostAlarmThresholdUsd
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CostAlertsTopic

Outputs:
  # --- Values the MOBILE/WEB app needs after deployment (client config) ------
  ApiBaseUrl:
    Description: >
      Base URL of the RojAnda HTTP API. Set EXPO_PUBLIC_ANALYSIS/TRANSCRIBE_BASE_URL
      from this.
    Value: !Sub https://${TranscribeApi}.execute-api.${AWS::Region}.amazonaws.com
  Region:
    Description: Deployed region (set EXPO_PUBLIC_COGNITO_REGION to this).
    Value: !Ref AWS::Region
  UserPoolId:
    Description: Cognito User Pool id (EXPO_PUBLIC_COGNITO_USER_POOL_ID).
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public app client id (EXPO_PUBLIC_COGNITO_APP_CLIENT_ID).
    Value: !Ref UserPoolClient
  JwtIssuer:
    Description: JWT issuer URL the API authorizer verifies.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  # --- Backend resources -----------------------------------------------------
  MediaBucket:
    Description: Private media bucket (audio + transcripts under owners/<sub>/).
    Value: !Ref MediaBucket
  AppTable:
    Description: Single-table persistent store (PK = OWNER#<sub>).
    Value: !Ref AppTable
